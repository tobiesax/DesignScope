title: Bloomfield kitchen transformation
town: Bloomfield
category: Kitchens
image: ba-after.jpg
beforeImage: ba-before.png
scope: Full kitchen remodel
time: 6 weeks
budget: $45k–$55k
brief: A dark 1990s oak kitchen with almond laminate, a closed-in layout and too little storage for a family of five.
did: Removed a soffit and half wall, added a navy island seating four, white shaker cabinets to the ceiling and a herringbone backsplash. Designed over two showroom visits.
result: Twice the counter space, a bright open room and a kitchen the whole family uses.
products:
  - Wellborn Forest cabinetry
  - MSI quartz
  - Delta faucet
  - Top Knobs hardware
quote: They showed us exactly what it would look like before a single cabinet came out.
who: The R. family
